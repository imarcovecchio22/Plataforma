<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
body{font-family:Poppins,sans-serif;overflow:hidden;background:var(--bg);color:var(--fg)}
.post{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;padding:150px 90px 0;text-align:center;overflow:hidden}
.bgfx{position:absolute;inset:0;pointer-events:none}
/* ---------- marca ---------- */
.brand{position:relative;display:flex;align-items:center;gap:14px;font-family:Fraunces,serif;font-weight:600;font-size:34px;letter-spacing:.04em;color:var(--brand)}
.brand i{width:26px;height:30px;background:var(--acc);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
/* ---------- cuerpo ---------- */
.body{position:relative;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:40px 0}
.eyebrow{font-weight:500;font-size:28px;letter-spacing:.3em;text-transform:uppercase;color:var(--acc)}
.title{font-family:Fraunces,serif;font-weight:600;font-size:124px;line-height:1;letter-spacing:-.015em;max-width:820px}
.title em,.title i{font-style:italic;font-weight:400;color:var(--acc)}
.text{font-size:36px;line-height:1.5;max-width:820px;color:var(--soft)}
.rule{width:110px;height:3px;border-radius:2px;background:var(--acc)}
.cta{display:inline-block;font-weight:600;font-size:30px;letter-spacing:.03em;padding:20px 46px;border-radius:999px;background:var(--acc);color:var(--ctafg)}
/* dato */
.num{font-family:Fraunces,serif;font-weight:700;font-size:250px;line-height:.9;color:var(--acc);letter-spacing:-.03em}
/* producto */
.photo{width:600px;height:600px;background:var(--photo-bg) center/cover no-repeat;flex-shrink:0}
.pname{font-family:Fraunces,serif;font-weight:600;font-size:72px;line-height:1.05}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;max-width:880px}
.chips span{font-size:26px;font-weight:500;padding:10px 24px;border-radius:999px;border:2px solid var(--acc);color:var(--fg)}
.price{font-family:Fraunces,serif;font-weight:700;font-size:96px;color:var(--acc);line-height:1}
/* ---------- pie ---------- */
.foot{position:relative;width:calc(100% + 180px);height:100px;display:flex;align-items:center;justify-content:center;gap:16px;font-size:28px;font-weight:500;letter-spacing:.06em;background:var(--footbg);color:var(--footfg);flex-shrink:0}
.foot b{width:9px;height:9px;border-radius:50%;background:var(--footdot)}
/* ---------- story (9:16): más aire, zona segura ---------- */
@media (max-aspect-ratio:10/16){
 .post{padding-top:260px}
 .body{gap:44px}
 .title{font-size:136px}
 .photo{width:720px;height:720px}
 .foot{height:120px;margin-bottom:170px;width:auto;border-radius:999px;padding:0 60px}
}

:root{--bg:#2a1606;--fg:#fff3dc;--soft:#f3dfc0;--acc:#e9a63a;--brand:#fff3dc;--ctafg:#2a1606;--footbg:#c97f08;--footfg:#2a1606;--footdot:#fff3dc;--photo-bg:url('{{imagen_url}}')}
.bgfx .hex{position:absolute;inset:0;opacity:.09}
.bgfx .glow{position:absolute;left:50%;top:52%;width:1100px;height:1100px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(233,166,58,.22) 0%,rgba(233,166,58,.08) 40%,transparent 68%)}
.bgfx .drip{position:absolute;top:0;left:0;width:100%;height:170px}
.photo{border-radius:300px 300px 40px 40px;box-shadow:0 0 0 10px rgba(233,166,58,.25),0 30px 80px rgba(0,0,0,.45)}
.brand{flex-direction:column;gap:12px;font-size:28px}
.brand .logo{height:150px;width:auto;display:block}
.brand .badge{width:196px;height:196px;margin-top:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff3dc;box-shadow:0 0 0 6px rgba(233,166,58,.35),0 16px 40px rgba(0,0,0,.35)}
.brand .logo{height:128px}
@media (max-aspect-ratio:10/16){.brand .badge{width:224px;height:224px;margin-top:0}.brand .logo{height:146px}}
/* feed (4:5): logo más chico y la foto cede espacio si no entra todo */
@media (min-aspect-ratio:10/16){
 .body{min-height:0}
 .brand .badge{width:160px;height:160px;margin-top:20px}.brand .logo{height:104px}
 .photo{flex:0 1 600px;height:auto;width:auto;aspect-ratio:1;min-height:0}
}
/* story: la foto también cede espacio para no pisar la zona segura de abajo */
@media (max-aspect-ratio:10/16){
 .body{min-height:0}
 .photo{flex:0 1 720px;height:auto;width:auto;aspect-ratio:1;min-height:0}
}
/* la cursiva de Fraunces se come el espacio siguiente */
.title em,.title i,.pname em,.pname i{padding-right:.06em}
</style></head>
<body><div class="post"><div class="bgfx"><svg class="hex" width="100%" height="100%"><defs><pattern id="h" width="90" height="155.88" patternUnits="userSpaceOnUse"><path d="M45 0 L90 25.98 L90 77.94 L45 103.92 L0 77.94 L0 25.98 Z M45 103.92 L45 155.88 M0 25.98 L-45 0 M90 25.98 L135 0" fill="none" stroke="#e9a63a" stroke-width="2"/></pattern></defs><rect width="100%" height="100%" fill="url(#h)"/></svg><div class="glow"></div><svg class="drip" viewBox="0 0 1080 230" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b86f05"/><stop offset=".6" stop-color="#d98f16"/><stop offset="1" stop-color="#eaa83c"/></linearGradient></defs><path fill="url(#g)" d="M0 0H1080V70C1060 70 1052 88 1050 110C1048 140 1030 150 1016 138C1004 128 1004 100 1000 86C994 70 970 68 956 80C944 92 946 170 928 196C914 216 890 210 886 186C882 160 890 110 884 92C876 70 846 70 836 86C826 102 834 118 820 124C806 130 796 118 792 100C786 78 760 72 744 82C726 94 736 140 718 150C700 160 690 142 688 120C686 96 676 78 656 76C632 74 624 96 622 120C620 150 616 216 594 222C572 228 566 200 566 176C566 140 574 100 560 86C546 72 520 74 512 94C506 110 510 130 494 134C476 138 470 118 466 100C462 82 444 72 426 80C406 90 414 122 396 128C380 132 370 114 368 96C366 80 352 70 334 74C314 80 316 120 312 150C308 184 298 196 284 194C266 192 262 172 262 150C262 118 270 94 254 80C238 68 214 72 206 90C198 108 206 130 188 136C170 140 162 122 158 104C154 88 140 72 120 76C100 80 104 110 98 124C92 140 76 142 68 128C60 114 64 92 50 80C38 70 16 70 0 74Z"/></svg></div>
<div class="brand"><span class="badge"><img class="logo" src="{{logo_src}}" alt="Melera"></span><span>@melera.miel</span></div>
<div class="body">
<div class="eyebrow">¿Sabías que?</div>
<div class="num fit">{{numero}}</div>
<p class="text fit" style="font-size:40px;color:var(--fg)">{{texto_dato}}</p>
<div class="rule"></div>
<span class="eyebrow" style="letter-spacing:.2em">{{tagline}}</span>
</div>
<div class="foot"><b></b>melera.vercel.app<b></b></div>
</div><script>
// caracteristicas: "Pura|Natural|500 g" -> chips
document.querySelectorAll('[data-list]').forEach(el=>{
  el.getAttribute('data-list').split('|').map(s=>s.trim()).filter(Boolean)
    .forEach(t=>{const s=document.createElement('span');s.textContent=t;el.appendChild(s)})});
// achica textos largos hasta que entren
function fit(){const body=document.querySelector('.body');let guard=0;
  while(body.scrollHeight>body.clientHeight+2 && guard++<40){
    document.querySelectorAll('.fit').forEach(el=>{const fs=parseFloat(getComputedStyle(el).fontSize);el.style.fontSize=(fs*0.94)+'px'})}}
document.fonts.ready.then(fit);
</script></body></html>

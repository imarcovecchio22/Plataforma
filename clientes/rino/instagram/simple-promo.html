<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- PROVISORIO: diseño de relleno de 3DRinoMaker (colores y fuentes de su config) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 100%; height: 100%; }
  body {
    position: relative; overflow: hidden; box-sizing: border-box; padding: 90px 90px 170px;
    display: flex; flex-direction: column; justify-content: center; gap: 28px;
    font-family: Inter, system-ui, sans-serif; color: #1c1917;
    background: #fff7ed;
  }
  /* Capas de impresión 3D: líneas horizontales finas que se desvanecen hacia arriba */
  .capas {
    position: absolute; inset: auto 0 0 0; height: 46%; z-index: -1;
    background: repeating-linear-gradient(to top, rgba(234, 88, 12, .16) 0 3px, transparent 3px 14px);
    -webkit-mask-image: linear-gradient(to top, #000, transparent); mask-image: linear-gradient(to top, #000, transparent);
  }
  .marca {
    position: absolute; left: 90px; right: 90px; bottom: 64px; display: flex; align-items: center; gap: 16px;
    font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 34px; color: #1c1917;
  }
  .marca b { display: inline-grid; place-items: center; width: 58px; height: 58px; border-radius: 14px; background: #ea580c; color: #fff; font-size: 22px; }
  .tagline { font-family: "Space Grotesk", sans-serif; font-size: 32px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #c2410c; }
  h1 { margin: 0; font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 98px; line-height: 1.02; letter-spacing: -.02em; }
  h1 em { font-style: normal; color: #ea580c; }
  p { margin: 0; font-size: 42px; line-height: 1.35; color: #44403c; }
  .grande { font-family: "Space Grotesk", sans-serif; font-size: 170px; font-weight: 700; line-height: 1; color: #ea580c; letter-spacing: -.03em; }
  .cta { align-self: flex-start; background: #c2410c; color: #fff; font-size: 38px; font-weight: 600; padding: 24px 46px; border-radius: 18px; }
  .foto { width: 100%; height: 520px; background: center / contain no-repeat url('{{imagen_url}}'); }
  .chips { display: flex; flex-wrap: wrap; gap: 14px; }
  .chips span { font-size: 32px; font-weight: 500; padding: 10px 24px; border-radius: 999px; border: 2px solid #fdba74; color: #9a3412; }
  .fila { display: flex; justify-content: space-between; gap: 24px; font-size: 40px; border-bottom: 2px solid #fed7aa; padding: 16px 0; }
  .fila strong { flex-shrink: 0; white-space: nowrap; font-family: "Space Grotesk", sans-serif; color: #c2410c; }
</style>
</head>
<body>
  <div class="tagline">{{tagline}}</div>
  <h1>{{titulo}}</h1>
  <div id="promos" data-promos="{{promos}}"></div>
  {{#if cta}}<div class="cta">{{cta}}</div>{{/if}}
  <script>
    // "1 unidad|$ 5.000|;3 unidades|$ 13.500|$ 4.500 c/u" -> una fila por promo
    var el = document.getElementById("promos");
    el.dataset.promos.split(";").forEach(function (fila) {
      var c = fila.split("|");
      var div = document.createElement("div");
      div.className = "fila";
      var nombre = document.createElement("span");
      nombre.textContent = c[0] + (c[2] ? " · " + c[2] : "");
      var precio = document.createElement("strong");
      precio.textContent = c[1];
      div.appendChild(nombre);
      div.appendChild(precio);
      el.appendChild(div);
    });
  </script>
  <div class="capas"></div>
  <div class="marca"><b>3DR</b>3DRinoMaker</div>
</body>
</html>

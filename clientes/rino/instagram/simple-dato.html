<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; }
  body { font-family: system-ui, sans-serif; background: #fff7ed; color: #1c1917; display: flex; flex-direction: column; justify-content: center; padding: 90px; box-sizing: border-box; gap: 28px; }
  .tagline { font-size: 34px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #c2410c; }
  h1 { margin: 0; font-size: 96px; line-height: 1.05; }
  h1 em { color: #c2410c; }
  p { margin: 0; font-size: 42px; line-height: 1.35; }
  .grande { font-size: 180px; font-weight: 800; color: #c2410c; }
  .cta { align-self: flex-start; background: #c2410c; color: #fff; font-size: 38px; font-weight: 700; padding: 22px 44px; border-radius: 16px; }
  .foto { width: 100%; height: 520px; background: center / contain no-repeat url('{{imagen_url}}'); }
  .fila { display: flex; justify-content: space-between; font-size: 40px; border-bottom: 2px solid #fed7aa; padding: 14px 0; }
</style>
</head>
<body>
  <div class="tagline">¿Sabías que?</div>
  <div class="grande">{{numero}}</div>
  <p>{{texto_dato}}</p>
  <div class="tagline">{{tagline}}</div>
</body>
</html>
